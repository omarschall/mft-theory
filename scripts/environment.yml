name: mft-theory
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - notebook<7.0  # Classic Jupyter Notebook 6.x (matches cluster - better UI than 7.0+)
  - jupyterlab>=4.0  # Also include JupyterLab as alternative (can be buggy with Safari)
  - pytorch::pytorch  # CPU-only PyTorch (no CUDA)
  - h5py  # For reading HDF5 files (if needed)
  - pip
  - pip:
    - watchdog  # For cluster sync tools
    # Optional (macOS only): pip install appscript
    # Enables automatic terminal/browser opening for cluster notebooks
    # If not installed, script will print commands for manual execution

# Installation notes:
# - This can take 5-10 minutes to solve dependencies (normal for conda)
# - If it's taking too long, you can try mamba (faster solver):
#     conda install mamba -n base -c conda-forge
#     mamba env create -f scripts/environment.yml
# - Running from any conda environment is fine - it creates a new isolated env
#
# After installation, use classic notebook (matches cluster UI):
#   conda activate mft-theory
#   jupyter notebook
# (Using notebook <7.0 to match cluster's better-looking UI - 7.0+ has a worse interface)

# To create this environment:
#   conda env create -f scripts/environment.yml
#
# To activate:
#   conda activate mft-theory
#
# To update:
#   conda env update -f scripts/environment.yml --prune
#
# Note: This environment uses CPU-only PyTorch by default.
#       For GPU support on cluster, use the cluster's environment.
